<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fire & Smoke Detector</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Smart Fire & Smoke Detector</h1>
            <span id="status-badge" class="badge badge-safe">SAFE</span>
        </header>

        <div class="main-grid">
            <div class="card camera-card">
                <h2>Camera Feed</h2>
                <div class="camera-wrapper">
                    <img id="camera-feed" src="" alt="Waiting for camera feed...">
                </div>
                <div id="detection-list" class="detection-list"></div>
            </div>

            <div class="card sensors-card">
                <h2>Sensor Data</h2>
                <div class="sensor-grid">
                    <div class="sensor-box" id="temp-box">
                        <div class="sensor-label">Temperature</div>
                        <div class="sensor-value" id="temp-value">--</div>
                        <div class="sensor-unit">&deg;C</div>
                    </div>
                    <div class="sensor-box" id="hum-box">
                        <div class="sensor-label">Humidity</div>
                        <div class="sensor-value" id="hum-value">--</div>
                        <div class="sensor-unit">%</div>
                    </div>
                    <div class="sensor-box" id="gas-box">
                        <div class="sensor-label">Gas Level</div>
                        <div class="sensor-value" id="gas-value">--</div>
                        <div class="sensor-unit">ppm</div>
                    </div>
                </div>

                <div class="traffic-light">
                    <div class="light red" id="light-red"></div>
                    <div class="light yellow" id="light-yellow"></div>
                    <div class="light green" id="light-green"></div>
                </div>

                <div class="buzzer-indicator" id="buzzer-indicator">Buzzer: OFF</div>
                <div class="buzzer-toggle-row">
                    <button id="buzzer-toggle-btn" class="buzzer-toggle-btn" onclick="toggleBuzzer()">🔊 Buzzer: ON</button>
                </div>
                <div class="reasons-box" id="reasons-box">
                    <div id="warmup-section">
                        <div class="reasons-title">Gas Sensor Warmup</div>
                        <div class="warmup-bar-container">
                            <div class="warmup-bar" id="warmup-bar"></div>
                        </div>
                        <div class="warmup-text" id="warmup-text">Waiting...</div>
                    </div>
                    <div id="triggers-section">
                        <div class="reasons-title">Trigger Reasons</div>
                        <div id="reasons-list" class="reasons-list">No triggers</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card chart-card">
            <h2>History (last 60s)</h2>
            <div class="chart-container">
                <canvas id="sensor-chart"></canvas>
            </div>
        </div>

        <footer>
            <span>Smart Fire & Smoke Detector v1.0</span>
            <span id="esp32-status"><span id="esp32-dot" class="dot dot-red"></span> ESP32: <span id="esp32-text">Waiting</span></span>
            <span id="connection-status">Server: Connected</span>
        </footer>
    </div>

    <script>
        const MAX_POINTS = 60;
        const tempData = [];
        const humData = [];
        const gasData = [];
        const labels = [];

        const ctx = document.getElementById('sensor-chart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Temperature (°C)',
                        data: tempData,
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.1)',
                        yAxisID: 'y',
                        tension: 0.3
                    },
                    {
                        label: 'Humidity (%)',
                        data: humData,
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        yAxisID: 'y',
                        tension: 0.3
                    },
                    {
                        label: 'Gas Level',
                        data: gasData,
                        borderColor: '#f39c12',
                        backgroundColor: 'rgba(243, 156, 18, 0.1)',
                        yAxisID: 'y1',
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                interaction: {
                    mode: 'index',
                    intersect: false
                },
                scales: {
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: { display: true, text: 'Temp / Humidity' }
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: { display: true, text: 'Gas' },
                        grid: { drawOnChartArea: false }
                    }
                }
            }
        });

        function updateBadge(state) {
            const badge = document.getElementById('status-badge');
            badge.className = 'badge';
            if (state === 0) {
                badge.classList.add('badge-safe');
                badge.textContent = 'SAFE';
            } else if (state === 1) {
                badge.classList.add('badge-warning');
                badge.textContent = 'WARNING';
            } else {
                badge.classList.add('badge-alarm');
                badge.textContent = 'ALARM';
            }
        }

        function updateTrafficLight(state) {
            document.getElementById('light-red').classList.remove('active');
            document.getElementById('light-yellow').classList.remove('active');
            document.getElementById('light-green').classList.remove('active');
            if (state === 0) {
                document.getElementById('light-green').classList.add('active');
            } else if (state === 1) {
                document.getElementById('light-yellow').classList.add('active');
            } else {
                document.getElementById('light-red').classList.add('active');
            }
        }

        function updateBuzzer(buzzer) {
            const el = document.getElementById('buzzer-indicator');
            if (buzzer === 1) {
                el.textContent = 'Buzzer: ON';
                el.classList.add('active');
            } else if (buzzer === 2) {
                el.textContent = 'Buzzer: INTERMITTENT';
                el.classList.add('active');
            } else {
                el.textContent = 'Buzzer: OFF';
                el.classList.remove('active');
            }
        }

        const WARMUP_DURATION = 600;

        function toggleBuzzer() {
            fetch('/toggle-buzzer', { method: 'POST' });
        }

        function updateBuzzerToggle(muted) {
            const btn = document.getElementById('buzzer-toggle-btn');
            if (muted) {
                btn.textContent = '🔇 Buzzer: OFF';
                btn.classList.add('muted');
            } else {
                btn.textContent = '🔊 Buzzer: ON';
                btn.classList.remove('muted');
            }
        }

        function updateReasons(reasons) {
            const el = document.getElementById('reasons-list');
            if (!reasons || reasons.length === 0) {
                el.innerHTML = '<span class="reasons-none">No triggers</span>';
                return;
            }
            el.innerHTML = reasons.map(r => `<div class="reason-item">${r}</div>`).join('');
        }

        function updateWarmup(remaining) {
            const warmupSection = document.getElementById('warmup-section');
            const triggersSection = document.getElementById('triggers-section');

            if (remaining > 0) {
                warmupSection.style.display = 'block';
                triggersSection.style.display = 'none';
                const pct = ((WARMUP_DURATION - remaining) / WARMUP_DURATION * 100).toFixed(0);
                document.getElementById('warmup-bar').style.width = pct + '%';
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                document.getElementById('warmup-text').textContent = `⏳ ${mins}m ${secs}s remaining (${pct}%)`;
            } else {
                warmupSection.style.display = 'none';
                triggersSection.style.display = 'block';
            }
        }

        function updateDetections(detections) {
            const list = document.getElementById('detection-list');
            if (!detections || detections.length === 0) {
                list.innerHTML = '<div class="detection-none">No fire/smoke detected</div>';
                return;
            }
            list.innerHTML = detections.map(d =>
                `<div class="detection-item detection-${d.label}">
                    ${d.label.toUpperCase()} — ${(d.confidence * 100).toFixed(0)}%
                </div>`
            ).join('');
        }

        const evtSource = new EventSource('/stream');
        evtSource.onmessage = function(event) {
            const data = JSON.parse(event.data);

            document.getElementById('temp-value').textContent = data.temperature !== '--' ? data.temperature.toFixed(1) : '--';
            document.getElementById('hum-value').textContent = data.humidity !== '--' ? data.humidity.toFixed(1) : '--';
            document.getElementById('gas-value').textContent = data.gas !== '--' ? data.gas : '--';

            updateBadge(data.state);
            updateTrafficLight(data.state);
            updateBuzzer(data.buzzer);
            updateDetections(data.detections);
            updateBuzzerToggle(data.buzzer_muted || false);
            updateWarmup(data.warmup_remaining || 0);
            if (!data.warmup_remaining || data.warmup_remaining <= 0) {
                updateReasons(data.trigger_reasons);
            }

            if (data.frame) {
                document.getElementById('camera-feed').src = 'data:image/jpeg;base64,' + data.frame;
            }

            const now = new Date().toLocaleTimeString();
            labels.push(now);
            const t = typeof data.temperature === 'number' ? data.temperature : null;
            const h = typeof data.humidity === 'number' ? data.humidity : null;
            const g = typeof data.gas === 'number' ? data.gas : null;
            tempData.push(t);
            humData.push(h);
            gasData.push(g);

            if (labels.length > MAX_POINTS) {
                labels.shift();
                tempData.shift();
                humData.shift();
                gasData.shift();
            }

            chart.update('none');

            const esp32Dot = document.getElementById('esp32-dot');
            const esp32Text = document.getElementById('esp32-text');
            if (data.esp32_connected) {
                esp32Dot.className = 'dot dot-green';
                esp32Text.textContent = 'Connected';
            } else {
                esp32Dot.className = 'dot dot-red';
                esp32Text.textContent = 'Disconnected';
            }
        };

        evtSource.onerror = function() {
            document.getElementById('connection-status').textContent = 'Server: Disconnected';
            document.getElementById('connection-status').style.color = '#e74c3c';
        };
    </script>
</body>
</html>
